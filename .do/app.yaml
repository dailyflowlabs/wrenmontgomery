alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: wrenmontgomery.com
  type: PRIMARY
  zone: wrenmontgomery.com
- domain: www.wrenmontgomery.com
  type: ALIAS
  zone: wrenmontgomery.com
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: wrenmontgomery
    match:
      path:
        prefix: /
name: wrenmontgomery
region: nyc
services:
- build_command: npm install
  environment_slug: node-js
  github:
    branch: main
    deploy_on_push: true
    repo: dailyflowlabs/wrenmontgomery
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: wrenmontgomery
  run_command: npm run start
  source_dir: /
