<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Wren Montgomery Official Store</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #100e0c;
      color: #f5f2eb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      box-sizing: border-box;
      margin: 0;
    }
    .success-card {
      max-width: 600px;
      width: 100%;
      background: radial-gradient(circle at top, rgba(38, 28, 20, 0.95), rgba(18, 14, 12, 0.98));
      border: 1px solid rgba(229, 155, 43, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(229, 155, 43, 0.15);
      border-radius: 20px;
      padding: 3rem 2rem;
      text-align: center;
      box-sizing: border-box;
    }
    .emblem-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(229, 155, 43, 0.15);
      border: 2px solid #e59b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e59b2b;
      font-size: 2rem;
    }
    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      letter-spacing: 0.02em;
      margin: 0 0 0.75rem;
      color: #fff;
    }
    .subtitle {
      color: #d1c7bc;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-block;
      background: linear-gradient(135deg, #e59b2b, #b46b1b);
      color: #120e0a;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(229, 155, 43, 0.4);
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="emblem-badge">★</div>
    <h1 class="title">Thank You, Y'all!</h1>
    <p class="subtitle">
      Your official Wren Montgomery order has been confirmed and sent to print. You'll receive a tracking number as soon as your gear hits the road from Nashville!
    </p>
    <a href="/" class="btn-home">Back to Official Site</a>
  </div>
</body>
</html>
